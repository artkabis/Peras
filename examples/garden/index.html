<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Garden of Apeiron</title>
    <meta
      name="description"
      content="Zoom into a procedural garden: a stored AVIF enlarged beside the 5.7 KB Peras program that draws the scene."
    />
    <link rel="icon" href="data:," />
    <style>
      :root {
        color-scheme: light dark;
        --bg: #f6f5f0;
        --panel: #ffffff;
        --fg: #1d1d1b;
        --muted: #66665f;
        --line: #dcdbd3;
        --accent: #2f6b3a;
        --accent-fg: #ffffff;
        font-family: system-ui, sans-serif;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #121311;
          --panel: #1b1c1a;
          --fg: #ececea;
          --muted: #9b9b94;
          --line: #31322e;
          --accent: #8cc497;
          --accent-fg: #10140f;
        }
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--fg);
        line-height: 1.5;
      }
      main {
        max-width: 68rem;
        margin: 0 auto;
        padding: 2rem 1rem 3rem;
      }
      h1 {
        margin: 0 0 0.25rem;
        font-size: clamp(1.5rem, 4vw, 2rem);
        letter-spacing: -0.01em;
      }
      .intro {
        color: var(--muted);
        margin: 0 0 1.5rem;
        max-width: 46rem;
      }
      .panels {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 1rem;
      }
      @media (max-width: 40rem) {
        .panels {
          grid-template-columns: 1fr;
        }
      }
      figure {
        margin: 0;
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 10px;
        overflow: hidden;
      }
      figcaption {
        display: flex;
        justify-content: space-between;
        align-items: baseline;
        flex-wrap: wrap;
        gap: 0.25rem 1rem;
        padding: 0.6rem 0.85rem;
        border-bottom: 1px solid var(--line);
      }
      figcaption strong {
        font-size: 0.95rem;
      }
      figcaption span {
        color: var(--muted);
        font-size: 0.85rem;
        font-variant-numeric: tabular-nums;
      }
      canvas {
        display: block;
        width: 100%;
        aspect-ratio: 1;
        touch-action: none;
        cursor: grab;
        background: var(--line);
      }
      canvas:active {
        cursor: grabbing;
      }
      canvas:focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: -2px;
      }
      .toolbar {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 0.5rem;
        margin: 1rem 0;
      }
      button {
        font: inherit;
        min-height: 2.5rem;
        padding: 0.4rem 0.9rem;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--panel);
        color: var(--fg);
        cursor: pointer;
      }
      button.primary {
        background: var(--accent);
        border-color: var(--accent);
        color: var(--accent-fg);
      }
      button:focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 2px;
      }
      output {
        margin-left: auto;
        color: var(--muted);
        font-size: 0.9rem;
        font-variant-numeric: tabular-nums;
      }
      .notes {
        color: var(--muted);
        font-size: 0.9rem;
        max-width: 46rem;
        padding-left: 1.1rem;
      }
      .notes li + li {
        margin-top: 0.35rem;
      }
      a {
        color: var(--accent);
      }
    </style>
  </head>
  <body>
    <main>
      <h1 id="title">The garden of Apeiron</h1>
      <p class="intro" id="intro"></p>
      <div class="panels">
        <figure>
          <figcaption><strong id="stored-title"></strong><span id="stored-meta"></span></figcaption>
          <canvas id="stored" tabindex="0"></canvas>
        </figure>
        <figure>
          <figcaption><strong id="drawn-title"></strong><span id="drawn-meta"></span></figcaption>
          <canvas id="drawn" tabindex="0"></canvas>
        </figure>
      </div>
      <div class="toolbar">
        <button id="out" type="button" aria-label="Zoom out">−</button>
        <button id="in" type="button" aria-label="Zoom in">+</button>
        <button id="home" type="button"></button>
        <button id="visit" type="button" class="primary"></button>
        <output id="readout" aria-live="polite"></output>
      </div>
      <ul class="notes" id="notes"></ul>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
