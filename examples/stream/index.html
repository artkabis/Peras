<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Sensor stream</title>
    <meta
      name="description"
      content="A stream of sensor readings digested by Peras in a Web Worker, beside the same digest in TypeScript, measured live."
    />
    <link rel="icon" href="data:," />
    <style>
      :root {
        color-scheme: light;
        --bg: #f6f5f0;
        --surface: #fcfcfb;
        --fg: #0b0b0b;
        --muted: #52514e;
        --line: #dcdbd3;
        --grid: #ecebe5;
        --peras: #2a78d6;
        --typescript: #eb6834;
        --bar: #2a78d6;
        --good: #1f7a3a;
        --critical: #c62828;
        --accent: #2a78d6;
        --accent-fg: #ffffff;
        font-family: system-ui, sans-serif;
      }
      @media (prefers-color-scheme: dark) {
        :root:where(:not([data-theme="light"])) {
          color-scheme: dark;
          --bg: #121211;
          --surface: #1a1a19;
          --fg: #f0efec;
          --muted: #c3c2b7;
          --line: #34342f;
          --grid: #262624;
          --peras: #3987e5;
          --typescript: #d95926;
          --bar: #3987e5;
          --good: #5cc37a;
          --critical: #ef6b6b;
          --accent: #3987e5;
          --accent-fg: #0b0b0b;
        }
      }
      :root[data-theme="dark"] {
        color-scheme: dark;
        --bg: #121211;
        --surface: #1a1a19;
        --fg: #f0efec;
        --muted: #c3c2b7;
        --line: #34342f;
        --grid: #262624;
        --peras: #3987e5;
        --typescript: #d95926;
        --bar: #3987e5;
        --good: #5cc37a;
        --critical: #ef6b6b;
        --accent: #3987e5;
        --accent-fg: #0b0b0b;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--fg);
        line-height: 1.5;
      }
      main {
        max-width: 72rem;
        margin: 0 auto;
        padding: 2rem 1rem 3rem;
      }
      h1 {
        margin: 0 0 0.25rem;
        font-size: clamp(1.5rem, 4vw, 2rem);
        letter-spacing: -0.01em;
      }
      h2 {
        margin: 0 0 0.5rem;
        font-size: 1rem;
      }
      .intro {
        color: var(--muted);
        margin: 0 0 1.25rem;
        max-width: 50rem;
      }
      .controls {
        display: flex;
        flex-wrap: wrap;
        gap: 0.5rem 1rem;
        align-items: center;
        margin-bottom: 1.25rem;
      }
      button,
      select {
        font: inherit;
        padding: 0.4rem 0.9rem;
        border-radius: 0.4rem;
        border: 1px solid var(--line);
        background: var(--surface);
        color: var(--fg);
        cursor: pointer;
      }
      button.primary {
        background: var(--accent);
        border-color: var(--accent);
        color: var(--accent-fg);
        min-width: 7rem;
      }
      button:disabled {
        opacity: 0.5;
        cursor: default;
      }
      label {
        display: inline-flex;
        gap: 0.4rem;
        align-items: center;
      }
      .tiles {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(10.5rem, 1fr));
        gap: 0.75rem;
        margin-bottom: 1.25rem;
      }
      .tile {
        background: var(--surface);
        border: 1px solid var(--line);
        border-radius: 0.5rem;
        padding: 0.75rem 0.9rem;
      }
      .tile .label {
        color: var(--muted);
        font-size: 0.8rem;
      }
      .tile .value {
        font-size: 1.4rem;
        font-variant-numeric: tabular-nums;
        font-weight: 600;
      }
      .tile .note {
        color: var(--muted);
        font-size: 0.75rem;
        font-variant-numeric: tabular-nums;
      }
      .good {
        color: var(--good);
      }
      .critical {
        color: var(--critical);
      }
      .charts {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(min(100%, 26rem), 1fr));
        gap: 0.75rem;
        margin-bottom: 1.25rem;
      }
      .card {
        background: var(--surface);
        border: 1px solid var(--line);
        border-radius: 0.5rem;
        padding: 0.9rem;
        position: relative;
        min-width: 0;
      }
      .legend {
        display: flex;
        gap: 1rem;
        font-size: 0.8rem;
        color: var(--muted);
        margin-bottom: 0.25rem;
      }
      .swatch {
        display: inline-block;
        width: 0.8rem;
        height: 0.2rem;
        border-radius: 1px;
        vertical-align: middle;
        margin-right: 0.3rem;
      }
      svg {
        display: block;
        width: 100%;
        height: auto;
        overflow: visible;
      }
      svg text {
        fill: var(--muted);
        font-size: 11px;
        font-variant-numeric: tabular-nums;
      }
      .tooltip {
        position: absolute;
        pointer-events: none;
        background: var(--fg);
        color: var(--bg);
        font-size: 0.75rem;
        padding: 0.3rem 0.5rem;
        border-radius: 0.3rem;
        white-space: nowrap;
        font-variant-numeric: tabular-nums;
        display: none;
      }
      .table-wrap {
        overflow-x: auto;
      }
      table {
        border-collapse: collapse;
        width: 100%;
        font-variant-numeric: tabular-nums;
        font-size: 0.9rem;
      }
      th,
      td {
        padding: 0.35rem 0.6rem;
        text-align: right;
        border-bottom: 1px solid var(--line);
        white-space: nowrap;
      }
      th:first-child,
      td:first-child {
        text-align: left;
      }
      th {
        color: var(--muted);
        font-weight: 500;
      }
      footer {
        color: var(--muted);
        font-size: 0.8rem;
        margin-top: 1.5rem;
      }
    </style>
  </head>
  <body data-batches="0">
    <main>
      <h1 id="title">A stream of sensors</h1>
      <p class="intro" id="intro"></p>
      <div class="controls">
        <button class="primary" id="run" type="button" disabled>Start</button>
        <label
          ><span id="rows-label">Rows per batch</span>
          <select id="rows">
            <option value="10000">10,000</option>
            <option value="50000" selected>50,000</option>
            <option value="100000">100,000</option>
          </select></label
        >
        <label
          ><input type="checkbox" id="compare" checked />
          <span id="compare-label">Compare with TypeScript</span></label
        >
        <button id="reset" type="button">Reset</button>
        <button id="json" type="button" disabled>Export JSON</button>
        <button id="csv" type="button" disabled>Export CSV</button>
      </div>
      <section class="tiles" id="tiles" aria-live="polite"></section>
      <section class="charts">
        <div class="card">
          <h2 id="times-title">Time per batch</h2>
          <div class="legend" id="times-legend"></div>
          <svg id="times" viewBox="0 0 480 220" role="img"></svg>
          <div class="tooltip" id="times-tip"></div>
        </div>
        <div class="card">
          <h2 id="histogram-title">Temperatures read</h2>
          <svg id="histogram" viewBox="0 0 480 220" role="img"></svg>
          <div class="tooltip" id="histogram-tip"></div>
        </div>
      </section>
      <section class="card">
        <h2 id="zones-title">Zones</h2>
        <div class="table-wrap"><table id="zones"></table></div>
      </section>
      <footer id="footer"></footer>
    </main>
    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
