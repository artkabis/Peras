<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 416" width="720" height="416" role="img" aria-label="How many times faster Peras is, run after run"><style>
  .bg{fill:#fcfcfb}.ink{fill:#0b0b0b}.muted{fill:#52514e}.grid{stroke:#e6e5df}.even{stroke:#9a9890;stroke-dasharray:4 3}
