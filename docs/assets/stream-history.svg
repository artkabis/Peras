</style><rect class="bg" width="720" height="416" rx="8"/><text class="ink title" x="20" y="28">How many times faster Peras is, run after run, at 100,000 rows</text><rect class="A" x="20" y="43" width="12" height="12" rx="2"/><text class="ink" x="38" y="53">over TypeScript as written</text><rect class="B" x="230" y="43" width="12" height="12" rx="2"/><text class="ink" x="248" y="53">over TypeScript written for speed</text><line class="grid" x1="70" x2="640" y1="300" y2="300"/><text class="muted" x="62" y="304" text-anchor="end">0×</text><line class="grid" x1="70" x2="640" y1="254" y2="254"/><text class="muted" x="62" y="258" text-anchor="end">1×</text><line class="grid" x1="70" x2="640" y1="208" y2="208"/><text class="muted" x="62" y="212" text-anchor="end">2×</text><line class="grid" x1="70" x2="640" y1="162" y2="162"/><text class="muted" x="62" y="166" text-anchor="end">3×</text><line class="grid" x1="70" x2="640" y1="116" y2="116"/><text class="muted" x="62" y="120" text-anchor="end">4×</text><line class="grid" x1="70" x2="640" y1="70" y2="70"/><text class="muted" x="62" y="74" text-anchor="end">5×</text><line class="even" x1="70" x2="640" y1="254" y2="254"/><text class="muted" x="640" y="248" text-anchor="end">as fast</text><path class="A" style="fill:none" stroke-width="2" d="M70,221.8L184,199.7L298,187L412,145.9L526,133.8L640,114.4"/><line class="A" stroke-width="2" x1="70" x2="70" y1="222.6" y2="221.1"/><circle class="A" cx="70" cy="221.8" r="4.5"/><text class="ink val" x="77" y="215.8">1.70</text><line class="A" stroke-width="2" x1="184" x2="184" y1="201.1" y2="198.3"/><circle class="A" cx="184" cy="199.7" r="4.5"/><text class="ink val" x="191" y="193.7">2.18</text><line class="A" stroke-width="2" x1="298" x2="298" y1="188.4" y2="185.4"/><circle class="A" cx="298" cy="187" r="4.5"/><text class="ink val" x="305" y="181">2.46</text><line class="A" stroke-width="2" x1="412" x2="412" y1="148.4" y2="143.5"/><circle class="A" cx="412" cy="145.9" r="4.5"/><text class="ink val" x="419" y="139.9">3.35</text><line class="A" stroke-width="2" x1="526" x2="526" y1="136.6" y2="130.6"/><circle class="A" cx="526" cy="133.8" r="4.5"/><text class="ink val" x="533" y="127.8">3.61</text><line class="A" stroke-width="2" x1="640" x2="640" y1="116.1" y2="112.2"/><circle class="A" cx="640" cy="114.4" r="4.5"/><text class="ink val" x="647" y="108.4">4.04</text><path class="B" style="fill:none" stroke-width="2" d="M70,256L184,244.1L298,235.2L412,210.9L526,206.3L640,195.6"/><line class="B" stroke-width="2" x1="70" x2="70" y1="257" y2="255.5"/><circle class="B" cx="70" cy="256" r="4.5"/><text class="ink val" x="77" y="250">0.96</text><line class="B" stroke-width="2" x1="184" x2="184" y1="245.1" y2="243"/><circle class="B" cx="184" cy="244.1" r="4.5"/><text class="ink val" x="191" y="238.1">1.21</text><line class="B" stroke-width="2" x1="298" x2="298" y1="236.8" y2="233.7"/><circle class="B" cx="298" cy="235.2" r="4.5"/><text class="ink val" x="305" y="229.2">1.41</text><line class="B" stroke-width="2" x1="412" x2="412" y1="214" y2="208.1"/><circle class="B" cx="412" cy="210.9" r="4.5"/><text class="ink val" x="419" y="204.9">1.94</text><line class="B" stroke-width="2" x1="526" x2="526" y1="208.4" y2="204.7"/><circle class="B" cx="526" cy="206.3" r="4.5"/><text class="ink val" x="533" y="200.3">2.04</text><line class="B" stroke-width="2" x1="640" x2="640" y1="197.4" y2="193.6"/><circle class="B" cx="640" cy="195.6" r="4.5"/><text class="ink val" x="647" y="189.6">2.27</text><text class="ink" x="70" y="318" text-anchor="middle">run 1</text><text class="muted" x="70" y="334" text-anchor="middle">as registered</text><text class="ink" x="184" y="318" text-anchor="middle">run 2</text><text class="muted" x="184" y="334" text-anchor="middle">static literals</text><text class="ink" x="298" y="318" text-anchor="middle">run 3</text><text class="muted" x="298" y="334" text-anchor="middle">runtime linked</text><text class="ink" x="412" y="318" text-anchor="middle">run 4</text><text class="muted" x="412" y="334" text-anchor="middle">fallback, block cache</text><text class="ink" x="526" y="318" text-anchor="middle">run 5</text><text class="muted" x="526" y="334" text-anchor="middle">one lookup</text><text class="ink" x="640" y="318" text-anchor="middle">run 6</text><text class="muted" x="640" y="334" text-anchor="middle">SIMD split</text><text class="muted" x="20" y="364">Same protocol, data and TypeScript in every run; only the compiler changed. Dot: geometric mean over 10</text><text class="muted" x="20" y="380">browser processes; line: 95 % interval. Peras's time per row: 439 ns in run 1, 182 ns in run 6. Decision</text><text class="muted" x="20" y="396">0015, Chromium.</text></svg>
