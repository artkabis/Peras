    .bg{fill:#1a1a19}.ink{fill:#f0efec}.muted{fill:#c3c2b7}.grid{stroke:#2c2c2a}.even{stroke:#6b6a63}.val{stroke:#1a1a19}
    .A{fill:#d95926;stroke:#d95926}.B{fill:#199e70;stroke:#199e70}
