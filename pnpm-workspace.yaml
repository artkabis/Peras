packages:
  - "packages/*"
  - "examples/*"

# Supply-chain protection: never install a version published less than 24 hours ago.
# Most compromised releases are caught and unpublished within that window.
# Do not add a minimumReleaseAgeExclude entry; bootstrap.sh fails if one appears.
minimumReleaseAge: 1440

# Security overrides: force patched versions of transitive dependencies.
# Remove an entry once every dependent ships the fix on its own.
overrides:
  # GHSA-g3hv-75wg-m249 (ReDoS via globparts amplification), pulled in by eslint.
  minimatch@<11.0.1: ">=11.0.1"
