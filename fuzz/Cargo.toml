# Fuzz targets for the lexer, the parser and the whole pipeline (cargo-fuzz).
# Run with a nightly toolchain: `cargo +nightly fuzz run <target>`.
# A separate workspace: libFuzzer needs nightly-only flags the main workspace never sees.
[package]
name = "perasc-fuzz"
version = "0.0.0"
edition = "2024"
publish = false
license = "MIT OR Apache-2.0"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4.13"
perasc-diag = { path = "../crates/perasc-diag" }
perasc-driver = { path = "../crates/perasc-driver" }
perasc-syntax = { path = "../crates/perasc-syntax" }
serde_json = "1.0.154"
wasmparser = "0.263.0"

[workspace]
members = ["."]

[[bin]]
name = "lex"
path = "fuzz_targets/lex.rs"
test = false
doc = false
bench = false

[[bin]]
name = "parse"
path = "fuzz_targets/parse.rs"
test = false
doc = false
bench = false

[[bin]]
name = "pipeline"
path = "fuzz_targets/pipeline.rs"
test = false
doc = false
bench = false
