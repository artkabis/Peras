# Every job blocks the merge. No warning, no known CVE, no missing translation.
# Actions are pinned to a full commit SHA (immutable); Renovate updates SHA and version comment together.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust (fmt, clippy, tests)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the pinned toolchain from rust-toolchain.toml
        run: rustup toolchain install
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
      # The fuzz targets run every night on nightly; check here that they still compile.
      - run: cargo fmt --manifest-path fuzz/Cargo.toml --check
      - run: cargo clippy --manifest-path fuzz/Cargo.toml --bins --locked -- -D warnings

  rust-deps:
    name: Rust dependencies (audit, deny)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # `advisories` checks the RustSec database (what cargo-audit does), so no separate audit action.
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check advisories bans licenses sources
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          manifest-path: fuzz/Cargo.toml
          command: check advisories bans licenses sources

  js:
    name: JS tooling (format, lint, types, tests, audit)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run format:check
      - run: pnpm run lint
      - run: pnpm run typecheck
      - run: pnpm run test
      - run: pnpm audit --audit-level low
      # The documentation site: a broken link, anchor or unknown code label fails the build.
      - run: pnpm run docs

  backends:
    # Decision 0001: the direct WebAssembly backend is checked against the Rust backend.
    name: Backends agree (direct WebAssembly and Rust)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the pinned toolchain from rust-toolchain.toml
        run: rustup toolchain install
      - name: Install wasm-bindgen, the version perasc-codegen-rs generates code for
        run: cargo install --locked wasm-bindgen-cli --version =0.2.130
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: node scripts/bench-backends.mjs --check
      # The browser kernels in Rust and AssemblyScript give what Peras and
      # JavaScript give: the comparison of bench/README.md stays runnable.
      - run: cargo build --release --locked -p perasc
      - name: Install the Chromium of the pinned Playwright
        run: node scripts/install-browser.mjs chromium
      - name: Peras, JavaScript, Rust and AssemblyScript agree in the browser benchmark
        run: node scripts/bench-browser.mjs --check --contenders

  i18n:
    name: Translations (English first, then French)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - run: node scripts/check-i18n.mjs

  e2e:
    # Kickoff plan, day 9: the example is built with Vite and run in a headless browser.
    name: End-to-end (Vite plugin, fib in Chromium)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the pinned toolchain from rust-toolchain.toml
        run: rustup toolchain install
      - run: cargo build --release --locked -p perasc
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install the Chromium of the pinned Playwright
        run: node scripts/install-browser.mjs chromium
      - run: pnpm run e2e
      - name: The garden's playground builds for production
        run: pnpm --filter peras-example-garden build
      - name: The stream app builds for production
        run: pnpm --filter peras-example-stream build
      - name: Peras and JavaScript agree in the browser benchmark
        run: node scripts/bench-browser.mjs --check
      - name: Split across Web Workers, the kernels give what they give directly
        run: node scripts/bench-workers.mjs --check
      - name: Maps and sets give what JavaScript's give
        run: node scripts/bench-maps.mjs --check
      - name: Managed and owned modules give what hand-written JavaScript gives
        run: node scripts/bench-managed.mjs --check
      - name: Peras lets no more web bugs through than decision 0011 recorded
        run: node scripts/bench-web-bugs.mjs --check
      - name: The case study agrees in TypeScript and in Peras
        run: node scripts/bench-case-study.mjs --check
      - name: sortBy gives what TypeScript's sort gives, and is not slower by a number
        run: node scripts/bench-sort.mjs --check
      - name: The three versions of the demo run and draw
        run: node scripts/demo.mjs --check
      - name: The garden of Apeiron gives the same pixels in every version
        run: node scripts/bench-garden.mjs --check
      - name: The dashboard gives the same summary in TypeScript and Peras (decision 0014)
        run: node scripts/bench-data.mjs --check
      - name: The candle's three gardens give the same pixels
        run: node scripts/candle.mjs --check
      - name: The A/B benchmark runs, with SIMD and without
        run: node scripts/bench-ab.mjs --a current --a-flags "--simd off" --b current --check

  webkit:
    # Safari's engine, JavaScriptCore, as Playwright builds it for Linux: close
    # to Safari, not Apple's own build. The measures go to the run's summary;
    # a disagreement between Peras and JavaScript, or between the builds,
    # fails the job.
    # Every job has a time limit, well above what it takes (1 to 4 minutes,
    # this one 5 to 15 with a slow install): a browser that hangs fails the
    # run instead of holding it for GitHub's six hours.
    name: Benchmarks in WebKit (Safari's engine)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the pinned toolchain from rust-toolchain.toml
        run: rustup toolchain install
      - run: cargo build --release --locked -p perasc
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install the WebKit of the pinned Playwright
        run: node scripts/install-browser.mjs webkit
      - name: Peras against JavaScript, in WebKit
        run: |
          node scripts/bench-browser.mjs --browser webkit
          cat target/bench-browser/RESULTS-webkit.md >> "$GITHUB_STEP_SUMMARY"
      - name: SIMD on against off, in WebKit
        run: |
          node scripts/bench-ab.mjs --browser webkit --a current --a-flags "--simd off" --b current
          cat target/bench-ab/REPORT.md >> "$GITHUB_STEP_SUMMARY"
