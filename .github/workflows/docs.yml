name: Documentation site

# Builds the documentation site from docs/ and publishes it on GitHub Pages,
# at https://artkabis.github.io/Peras/, on every push to main. CI builds it
# on every pull request too, where a broken link, anchor or code label fails.
# Pages must be set to deploy from GitHub Actions: Settings, Pages, Source.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# One deployment at a time; a newer push does not cancel one under way.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build the documentation site
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run docs
      # The garden's playground, built with the compiler, served at /playground/.
      - name: Install the pinned toolchain from rust-toolchain.toml
        run: rustup toolchain install
      - run: cargo build --release --locked -p perasc
      - run: pnpm --filter peras-example-garden build --outDir ../../website/dist/playground
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: website/dist

  deploy:
    name: Publish on GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
