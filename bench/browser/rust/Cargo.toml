# The browser benchmark's kernels in Rust, compiled with wasm-bindgen: a
# contender to Peras. Outside the workspace, built by
# scripts/bench-browser.mjs --contenders.
[package]
name = "bench-browser-rust"
version = "0.0.0"
edition = "2024"
license = "AGPL-3.0-or-later"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
wasm-bindgen = "=0.2.130"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"

[lints.rust]
unsafe_code = "forbid"

[workspace]
