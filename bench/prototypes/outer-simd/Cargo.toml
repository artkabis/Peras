# A ceiling, measured before deciding: Mandelbrot and n-body vectorized
# across their outer loop, by hand, as Peras could emit them. Not part of
# Peras; run with `node bench/prototypes/outer-simd/run.mjs`.
[package]
name = "outer-simd"
version = "0.0.0"
edition = "2024"
license = "AGPL-3.0-or-later"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
wasm-bindgen = "=0.2.130"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"

[lints.rust]
unsafe_code = "forbid"

[workspace]
